[package]
name = "okuchi"
version = "0.1.0"
edition = "2021"
authors = ["Nelson Dominguez <ekkolon@proton.me>"]
description = "Okamoto-Uchiyama Cryptosystem Implementation"
license = "MIT OR Apache-2.0"
readme = "README.md"

[features]
default = ["seal"]
seal = ["stream", "dep:chacha20poly1305"]
stream = []

[dependencies]
num-bigint-dig = { version = "0.9.1", features = [
    "zeroize",
    "prime",
    "rand",
    "u64_digit",
] }
num-traits = "0.2"
num-integer = "0.1"
rand = "0.9.3"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2"
# Constant-time modular arithmetic for the decryption hot path (SECURITY-2).
# BoxedUint provides heap-allocated variable-width integers with CT guarantees.
crypto-bigint = { version = "0.7", features = ["alloc"] }
blake3 = { version = "1.8.4", features = ["rayon", "zeroize", "digest"] }
chacha20poly1305 = { version = "0.10", optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "okuchi"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
